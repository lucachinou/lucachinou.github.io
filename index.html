        </div>
      </div>

    <script>
      const Selector = document.getElementById("Selector");
      const SkillsButton = document.getElementById("SkillsBtn");
      const ProjectsButton = document.getElementById("ProjectsBtn");

      let SkillsSection = document.getElementsByClassName("SkillsContainer")[0];
      let ProjectsSection = document.getElementsByClassName("ProjectsContainer")[0];

      let CurrentSelected = SkillsButton;

      SkillsSection.style.display = 'grid'

      SkillsButton.addEventListener('click', () => {
        CurrentSelected = SkillsButton;
        SkillsSection.style.display = 'grid'
        ProjectsSection.style.display = 'none'
        ComputeSelectorPosition();
      });

      ProjectsButton.addEventListener('click', () => {
        CurrentSelected = ProjectsButton;
        SkillsSection.style.display = 'none'
        ProjectsSection.style.display = 'grid'
        ComputeSelectorPosition();
      });
      
      function ComputeSelectorPosition() {
        const bound = CurrentSelected.getBoundingClientRect();
      
        Selector.style.position = 'absolute';
        Selector.style.left = (bound.left + bound.width / 2 - 5) + "px";
        Selector.style.top = (bound.top + window.scrollY - Selector.offsetHeight + 55) + "px";
      }
      ComputeSelectorPosition();

      window.addEventListener('resize', ComputeSelectorPosition);
      window.addEventListener('scroll', ComputeSelectorPosition);
    </script>
