name: validate-aideia

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate aideia structure
        run: node tools/validate-repo.mjs
      - name: Syntax-check audit tool
        run: node --check tools/aideia-audit.mjs
      - name: Syntax-check bootstrap shell
        run: sh -n tools/bootstrap-aideia.sh
